<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Set Question Paper</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Set Question Paper</h1>

    <h2 th:text="${assessment.title}"></h2>

    <p>
        Subject:
        <b th:text="${assessment.subject.name}"></b>
    </p>

    <p class="success" th:if="${message}"
       th:text="${message}"></p>

    <p class="error" th:if="${error}"
       th:text="${error}"></p>

    <form method="post"
          th:action="@{/admin/assessment/{id}/question(id=${assessment.id})}">

        <label>Enter Question</label>
        <textarea name="questionText" required></textarea>

        <label>Option A</label>
        <input name="optionA" required>

        <label>Option B</label>
        <input name="optionB" required>

        <label>Option C</label>
        <input name="optionC" required>

        <label>Option D</label>
        <input name="optionD" required>

        <label>Correct Answer</label>
        <select name="correctOption">
            <option value="A">Option A</option>
            <option value="B">Option B</option>
            <option value="C">Option C</option>
            <option value="D">Option D</option>
        </select>

        <label>Marks</label>
        <input type="number" name="marks"
               min="1" value="1" required>

        <button type="submit">Add Question</button>

    </form>

    <h2>Questions Added</h2>

    <div th:each="q,iter : ${questions}" class="card">

        <h3 th:text="${iter.count + '. ' + q.questionText}"></h3>

        <p th:text="'A. ' + ${q.optionA}"></p>
        <p th:text="'B. ' + ${q.optionB}"></p>
        <p th:text="'C. ' + ${q.optionC}"></p>
        <p th:text="'D. ' + ${q.optionD}"></p>

        <p th:text="'Marks: ' + ${q.marks}"></p>

    </div>

    <form method="post"
          th:action="@{/admin/assessment/{id}/publish(id=${assessment.id})}">

        <button type="submit"
                th:disabled="${#lists.isEmpty(questions)}">
            Publish Question Paper
        </button>

    </form>

    <a th:href="@{/admin/dashboard}">Back to Dashboard</a>

</div>

</body>
</html>
