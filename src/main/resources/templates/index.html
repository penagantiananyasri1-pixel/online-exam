<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Examination System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">
    <h1>ONLINE EXAMINATION SYSTEM</h1>
    <p>Welcome to the Examination Portal</p>

    <div class="cards">
        <div class="card">
            <h2>Admin Login</h2>
            <p>Manage examinations and question papers.</p>
            <a th:href="@{/admin/login}">
                <button>Admin Login</button>
            </a>
        </div>

        <div class="card">
            <h2>Student Login</h2>
            <p>Attend examinations and view marks.</p>
            <a th:href="@{/student/login}">
                <button>Student Login</button>
            </a>
        </div>
    </div>
</div>

</body>
</html>
