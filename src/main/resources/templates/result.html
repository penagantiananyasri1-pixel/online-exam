<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Examination Result</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Examination Result</h1>

    <h2>Congratulations!</h2>

    <p>
        Student Name:
        <b th:text="${student.name}"></b>
    </p>

    <p>
        Roll Number:
        <b th:text="${student.rollNumber}"></b>
    </p>

    <p>
        Subject:
        <b th:text="${assessment.subject.name}"></b>
    </p>

    <h1 class="score">
        <span th:text="${score}"></span> /
        <span th:text="${total}"></span>
    </h1>

    <h2>Your Current Assessment Score</h2>

    <a th:href="@{/student/dashboard}">
        <button type="button">Go to Dashboard</button>
    </a>

    <h2>All Previous Assessment Marks</h2>

    <table>

        <tr>
            <th>Assessment</th>
            <th>Subject</th>
            <th>Marks Obtained</th>
            <th>Date</th>
        </tr>

        <tr th:each="r : ${history}">

            <td th:text="${r.assessment.title}"></td>

            <td th:text="${r.assessment.subject.name}"></td>

            <td th:text="${r.score + ' / ' + r.totalMarks}"></td>

            <td th:text="${#temporals.format(r.submittedAt,
                'dd-MM-yyyy HH:mm')}"></td>

        </tr>

    </table>

</div>

</body>
</html>
