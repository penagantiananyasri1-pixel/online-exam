<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Student Dashboard</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <h1>Welcome, <span th:text="${student.name}"></span></h1>

    <p>
        Roll Number:
        <b th:text="${student.rollNumber}"></b>
    </p>

    <h2>Select Examination</h2>

    <div th:if="${#lists.isEmpty(assessments)}">
        No examinations available.
    </div>

    <div th:each="a : ${assessments}" class="card">

        <h3 th:text="${a.subject.name}"></h3>

        <p th:text="${a.title}"></p>

        <a th:href="@{/student/exam/{id}(id=${a.id})}">
            <button type="button">Start Examination</button>
        </a>

    </div>

    <h2>All Previous Assessment Marks</h2>

    <table>
        <tr>
            <th>Assessment</th>
            <th>Subject</th>
            <th>Score</th>
            <th>Submitted Date</th>
        </tr>

        <tr th:each="r : ${history}">

            <td th:text="${r.assessment.title}"></td>

            <td th:text="${r.assessment.subject.name}"></td>

            <td th:text="${r.score + ' / ' + r.totalMarks}"></td>

            <td th:text="${#temporals.format(r.submittedAt,
                'dd-MM-yyyy HH:mm')}"></td>

        </tr>
    </table>

    <form method="post" th:action="@{/student/logout}">
        <button type="submit">Logout</button>
    </form>

</div>

</body>
</html>
